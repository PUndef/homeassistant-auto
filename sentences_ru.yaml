# Кастомные фразы для распознавания команд (опционально)
# Этот файл позволяет добавить дополнительные фразы для триггеров

language: "ru"
intents:
  # Справка
  HelpIntent:
    data:
      - sentences:
          - "помощь"
          - "что ты умеешь"
          - "список команд"
          - "справка"

  # Время
  GetTime:
    data:
      - sentences:
          - "который час"
          - "какое время"
          - "сколько времени"

  GetDate:
    data:
      - sentences:
          - "какое число"
          - "какая дата"
          - "какой сегодня день"

  # Погода
  WeatherNow:
    data:
      - sentences:
          - "какая сейчас погода"
          - "погода за окном"
          - "что с погодой"

  # Статус дома
  HomeStatus:
    data:
      - sentences:
          - "статус дома"
          - "что в доме"
          - "что включено"
          - "проверь дом"

  HomeTemperature:
    data:
      - sentences:
          - "какая температура [в доме]"
          - "температура [в помещении]"

  # Режимы
  GoodNight:
    data:
      - sentences:
          - "спокойной ночи"
          - "добрый ночи"
          - "ложусь спать"
          - "иду спать"

  GoodMorning:
    data:
      - sentences:
          - "доброе утро"
          - "привет"
          - "проснулся"

  LeavingHome:
    data:
      - sentences:
          - "ухожу"
          - "уходим [из дома]"
          - "уезжаю"

  ArrivingHome:
    data:
      - sentences:
          - "я дома"
          - "мы дома"
          - "пришёл [домой]"
          - "вернулся"

  # Выключить всё
  TurnOffEverything:
    data:
      - sentences:
          - "выключи всё"
          - "выключить всё"
          - "погаси весь свет"
