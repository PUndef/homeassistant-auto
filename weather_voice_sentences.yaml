# Этот файл нужно поместить в:
# config/custom_sentences/ru/weather.yaml
#
# Создайте папки если их нет:
# config/custom_sentences/ru/

language: "ru"
intents:
  GetWeatherForecast:
    data:
      - sentences:
          - "[какая] погода [сегодня]"
          - "[какая] погода {phrase}"
          - "[какая] погода [на] [завтра]"
          - "[какой] [будет] прогноз погоды [на] {phrase}"
          - "прогноз погоды [на] {phrase}"
          - "погода [на] {phrase}"
          - "погода сегодня"
          - "погода завтра"
          - "погода послезавтра"
        slots:
          phrase:
            - "сегодня"
            - "завтра"
            - "послезавтра"
            - "понедельник"
            - "вторник"
            - "среда"
            - "четверг"
            - "пятница"
            - "суббота"
            - "воскресенье"
            - "утро"
            - "утром"
            - "день"
            - "днем"
            - "вечер"
            - "вечером"
            - "ночь"
            - "ночью"
