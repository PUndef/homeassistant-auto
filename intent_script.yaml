# ==================== ПРИШЛИ ДОМОЙ ====================

ArrivingHome:
  speech:
    text: "С возвращением! Включаю свет."
  action:
    - service: light.turn_on
      target:
        entity_id: light.living_room
      data:
        brightness_pct: 80
